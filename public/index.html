<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>IC24 Media Talk - Tactical Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <header class="top-bar panel">
        <div class="brand">
          <div class="brand-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
          </div>
          <div class="brand-text">
            <h1>IC24 Media Talk</h1>
            <div class="user-id-display">
              User ID: <span id="userId">Detecting...</span>
            </div>
          </div>
        </div>
        <div class="callsign-setup">
          <input
            type="text"
            id="username"
            placeholder="Callsign..."
            maxlength="30"
          />
          <button id="saveUsernameBtn">Save</button>
        </div>
      </header>

      <div class="status-grid">
        <div class="panel status-card" id="serverStatus">
          <div class="status-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
          </div>
          <div class="status-info">
            <span class="status-label">SERVER</span>
            <span class="status-value">Disconnected</span>
          </div>
        </div>

        <div class="panel status-card" id="micStatus">
          <div class="status-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path
                d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"
              ></path>
              <path
                d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"
              ></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </div>
          <div class="status-info">
            <span class="status-label">MICROPHONE</span>
            <span class="status-value">Standby</span>
          </div>
        </div>

        <div class="panel status-card" id="channelStatus">
          <div class="status-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="2"></circle>
              <path
                d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48 0a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"
              ></path>
            </svg>
          </div>
          <div class="status-info">
            <span class="status-label">CHANNEL</span>
            <span class="status-value" id="channelName">Ready</span>
          </div>
        </div>
      </div>

      <div class="panel transmission-panel">
        <div class="panel-header">
          <span class="panel-title">TRANSMISSION CONTROL</span>
          <label class="latch-option">
            <input type="checkbox" id="latchMode" />
            <span class="checkbox-custom"></span>
            Latch Mode
          </label>
        </div>

        <div class="visualizer-box">
          <canvas id="waveform" class="waveform"></canvas>

          <div class="signal-indicator" id="signalIndicator">
            <span class="signal-dot"></span>
            <span class="signal-text">Idle</span>
          </div>
        </div>

        <button id="pttButton" class="ptt-btn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="btn-icon"
          >
            <path
              d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"
            ></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
          PUSH TO TALK
          <div class="ptt-latch-indicator" id="latchIndicator">LATCHED</div>
        </button>

        <div class="volume-control">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          </svg>
          <input type="range" id="volumeSlider" min="0" max="100" value="75" />
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path
              d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
            ></path>
          </svg>
          <span id="volumeValue">75%</span>
        </div>
      </div>

      <div class="bottom-grid">
        <div class="panel peers-panel">
          <div class="panel-header">
            <span class="panel-title">ACTIVE PEERS</span>
            <span id="peerCount" class="badge">0</span>
          </div>
          <div id="peersList" class="peers-list">
            <div class="placeholder">Waiting for connections...</div>
          </div>
        </div>

        <div class="panel chat-panel">
          <div class="panel-header">
            <span class="panel-title">TEAM CHAT</span>
            <button id="clearChatBtn" class="text-btn">Clear</button>
          </div>
          <div id="chatMessages" class="chat-messages">
            <div class="placeholder">Secure channel ready.</div>
          </div>
          <div class="chat-input-area">
            <input
              type="text"
              id="chatInput"
              placeholder="Enter message..."
              maxlength="200"
            />
            <button id="sendChatBtn" class="send-btn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
            <button
              id="sendVibrateBtn"
              class="send-btn nudge-btn"
              title="Send Nudge"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
